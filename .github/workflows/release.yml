name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run smoke
          npm run verify

      - name: Build installer and publish release
        run: npx electron-builder --win --publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
